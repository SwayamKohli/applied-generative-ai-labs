<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#f8fafc">Mini-RAG Assistant Evaluation &amp; Semantic Retrieval Metrics</text>
  <text x="40" y="70" font-size="13" fill="#94a3b8">Embedding Model: sentence-transformers/all-MiniLM-L6-v2 | Vector DB: FAISS IndexFlatIP (384-Dim)</text>

  <!-- Summary KPI Cards -->
  <!-- Card 1 -->
  <rect x="40" y="95" width="190" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="55" y="122" font-size="12" fill="#94a3b8">RETRIEVAL ACCURACY</text>
  <text x="55" y="156" font-size="26" font-weight="bold" fill="#34d399">100.0%</text>
  <text x="165" y="156" font-size="12" fill="#64748b">5/5</text>

  <!-- Card 2 -->
  <rect x="250" y="95" width="190" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="265" y="122" font-size="12" fill="#94a3b8">FACTUAL GROUNDING</text>
  <text x="265" y="156" font-size="26" font-weight="bold" fill="#60a5fa">100.0%</text>
  <text x="375" y="156" font-size="12" fill="#64748b">5/5</text>

  <!-- Card 3 -->
  <rect x="460" y="95" width="190" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="475" y="122" font-size="12" fill="#94a3b8">HALLUCINATION RATE</text>
  <text x="475" y="156" font-size="26" font-weight="bold" fill="#10b981">0.0%</text>
  <text x="555" y="156" font-size="12" fill="#64748b">(Zero)</text>

  <!-- Card 4 -->
  <rect x="670" y="95" width="240" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="685" y="122" font-size="12" fill="#94a3b8">OUT-OF-DOMAIN REFUSAL</text>
  <text x="685" y="156" font-size="26" font-weight="bold" fill="#fbbf24">VERIFIED</text>
  <text x="835" y="156" font-size="12" fill="#64748b">Gated</text>

  <!-- Main Chart Container -->
  <rect x="40" y="195" width="870" height="255" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="225" font-size="14" font-weight="bold" fill="#e2e8f0">Cosine Similarity Scores Across Evaluation Queries</text>
  <text x="65" y="242" font-size="11" fill="#64748b">Higher is better (Normalized Inner Product Score [0.0 - 1.0])</text>

  <!-- Grid lines -->
  <line x1="280" y1="260" x2="280" y2="415" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="430" y1="260" x2="430" y2="415" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="580" y1="260" x2="580" y2="415" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="730" y1="260" x2="730" y2="415" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="880" y1="260" x2="880" y2="415" stroke="#334155" stroke-dasharray="3,3"/>

  <text x="280" y="432" font-size="10" fill="#64748b" text-anchor="middle">0.0</text>
  <text x="430" y="432" font-size="10" fill="#64748b" text-anchor="middle">0.25</text>
  <text x="580" y="432" font-size="10" fill="#64748b" text-anchor="middle">0.50</text>
  <text x="730" y="432" font-size="10" fill="#64748b" text-anchor="middle">0.75</text>
  <text x="880" y="432" font-size="10" fill="#64748b" text-anchor="middle">1.00</text>

  <!-- Query 1 Bar -->
  <text x="65" y="280" font-size="12" fill="#cbd5e1">Q1: Attendance Rules (Page 1)</text>
  <rect x="280" y="268" width="477" height="16" rx="4" fill="url(#gradGreen)"/>
  <text x="765" y="281" font-size="11" font-weight="bold" fill="#34d399">0.7952</text>

  <!-- Query 2 Bar -->
  <text x="65" y="306" font-size="12" fill="#cbd5e1">Q2: Academic Leave (Page 4)</text>
  <rect x="280" y="294" width="482" height="16" rx="4" fill="url(#gradBlue)"/>
  <text x="770" y="307" font-size="11" font-weight="bold" fill="#60a5fa">0.8044</text>

  <!-- Query 3 Bar -->
  <text x="65" y="332" font-size="12" fill="#cbd5e1">Q3: Exam Misconduct (Page 2)</text>
  <rect x="280" y="320" width="435" height="16" rx="4" fill="url(#gradPurple)"/>
  <text x="723" y="333" font-size="11" font-weight="bold" fill="#a78bfa">0.7251</text>

  <!-- Query 4 Bar -->
  <text x="65" y="358" font-size="12" fill="#cbd5e1">Q4: Library Timings (Page 5)</text>
  <rect x="280" y="346" width="320" height="16" rx="4" fill="url(#gradAmber)"/>
  <text x="608" y="359" font-size="11" font-weight="bold" fill="#fbbf24">0.5339</text>

  <!-- Query 5 Bar -->
  <text x="65" y="384" font-size="12" fill="#cbd5e1">Q5: Grading &amp; CGPA (Page 3)</text>
  <rect x="280" y="372" width="422" height="16" rx="4" fill="url(#gradBlue)"/>
  <text x="710" y="385" font-size="11" font-weight="bold" fill="#60a5fa">0.7048</text>

  <!-- Query 6 Bar (Out of domain / Gated) -->
  <text x="65" y="410" font-size="12" fill="#94a3b8">Q6: Pets &amp; Scooters (Edge Case)</text>
  <rect x="280" y="398" width="259" height="16" rx="4" fill="url(#gradRed)" opacity="0.75"/>
  <text x="547" y="411" font-size="11" font-weight="bold" fill="#f87171">0.4326 (Gated Refusal)</text>
</svg>